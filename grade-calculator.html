<h1>Option Pricing &mdash; Grade Calculator</h1>
<p class="sub">University of Bonn &middot; 2025/2026</p>

<label for="gc-final">Final exam score (0–100)</label>
<input id="gc-final" type="number" min="0" max="100" value="" placeholder="e.g. 72" oninput="compute()">

<label for="gc-mid">Mid-term score (0–100, optional)</label>
<input id="gc-mid" type="number" min="0" max="100" value="" placeholder="e.g. 65" oninput="compute()">

<div id="result"></div>

<script>
(function () {
  var GRADES = [1.0, 1.3, 1.7, 2.0, 2.3, 2.7, 3.0, 3.3, 3.7, 4.0, 5.0];

  function bavarianGrade(f) { return 1 + 3 * (100 - f) / 50; }
  function bonus(m) { return 0.7 * Math.max(0, (m - 50) / 50); }
  function roundDiscrete(g) {
    return GRADES.reduce(function (a, b) {
      return Math.abs(b - g) < Math.abs(a - g) ? b : a;
    });
  }
  function computeGrade(f, m) {
    if (f < 50) return 5.0;
    var b = bavarianGrade(f);
    var gNone = roundDiscrete(b);
    var g = roundDiscrete(Math.max(1.0, b - bonus(m)));
    if (gNone - g > 0.7) g = roundDiscrete(gNone - 0.7);
    return g;
  }

  window.compute = function () {
    var fVal = document.getElementById('gc-final').value;
    var mVal = document.getElementById('gc-mid').value;
    var out  = document.getElementById('result');

    if (fVal === '') { out.innerHTML = ''; return; }

    var f = parseInt(fVal, 10);
    var m = mVal === '' ? 0 : parseInt(mVal, 10);

    if (isNaN(f) || f < 0 || f > 100 || isNaN(m) || m < 0 || m > 100) {
      out.innerHTML = '<em>Please enter scores between 0 and 100.</em>';
      return;
    }

    var grade        = computeGrade(f, m);
    var gradeNoBonus = computeGrade(f, 0);

    var html = 'Grade: <strong>' + grade.toFixed(1) + '</strong>';
    if (mVal !== '' && m > 0) {
      html += '<div class="secondary">Without mid-term: ' + gradeNoBonus.toFixed(1) + '</div>';
    }
    out.innerHTML = html;
  };
})();
</script>
